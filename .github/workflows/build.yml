name: Build TwinDial

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-15-intel
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - build_variant: rootful
          - build_variant: rootless
          # - build_variant: roothide

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build Package
        run: |
          sh build.sh "${{ matrix.build_variant }}"
          set -euo pipefail
          for deb in packages/*.deb; do
            temp=$(mktemp -d)
            dpkg-deb -x "$deb" "$temp"
            prefix="$temp/var/jb/Library"
            for binary in "$prefix/MobileSubstrate/DynamicLibraries/AxsTwinDial.dylib" "$prefix/PreferenceBundles/AxsTwinDialPrefs.bundle/AxsTwinDialPrefs"; do
              xcrun lipo "$binary" -verify_arch arm64 arm64e
              codesign -d "$binary"
            done
            for art in next previous pause; do
              test -s "$prefix/Application Support/AxsTwinDialResources.bundle/$art.png"
            done
            test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error
